services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      DWAVE_API_TOKEN: ${DWAVE_API_TOKEN:-}
      QA_DNR_USERS: ${QA_DNR_USERS:-}
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 25s

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    entrypoint: ["sh", "-c", "while true; do pg_dump -h postgres -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db} | gzip > /backups/app_db-$$(date +%Y%m%d-%H%M%S).sql.gz; find /backups -name '*.sql.gz' -mtime +7 -delete; sleep 86400; done"]

volumes:
  db-data:
